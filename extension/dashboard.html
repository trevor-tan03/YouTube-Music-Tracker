<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>YouTube Music Tracker - Dashboard</title>
        <link rel="stylesheet" href="./styles/dashboard.css" />
    </head>
    <body class="dashboard-page">
        <div class="dashboard-container">
            <nav class="dashboard-nav">
                <button class="dashboard-tab active" data-view="top-tracks">
                    <span class="icon">🏆</span>
                    <span>Top Tracks</span>
                </button>
                <button class="dashboard-tab" data-view="all-videos">
                    <span class="icon">📹</span>
                    <span>All Videos</span>
                </button>
                <button class="dashboard-tab" data-view="stats">
                    <span class="icon">📊</span>
                    <span>Statistics</span>
                </button>
            </nav>

            <!-- Top Tracks View -->
            <section id="top-tracks-view" class="dashboard-view active">
                <div class="view-section">
                    <h2 class="section-title">Your Most Listened Tracks</h2>

                    <div class="search-bar">
                        <input
                            type="text"
                            id="tracks-search-input"
                            placeholder="Search tracks by title or channel..."
                        />
                    </div>

                    <div class="tabs">
                        <button class="tab active" data-period="day">
                            Today
                        </button>
                        <button class="tab" data-period="week">
                            This Week
                        </button>
                        <button class="tab" data-period="month">
                            This Month
                        </button>
                        <button class="tab" data-period="year">
                            This Year
                        </button>
                        <button class="tab" data-period="all">All Time</button>
                        <select id="artist-filter">
                            <option value="">All artists</option>
                        </select>
                    </div>

                    <div
                        class="tracks-stats"
                        id="tracks-stats"
                        style="
                            margin-top: 1rem;
                            padding: 1rem;
                            background: rgba(136, 192, 208, 0.1);
                            border-radius: 8px;
                            display: none;
                        "
                    >
                        <div
                            style="
                                display: flex;
                                gap: 2rem;
                                justify-content: center;
                                flex-wrap: wrap;
                            "
                        >
                            <div style="text-align: center">
                                <div
                                    style="
                                        font-size: 1.5rem;
                                        font-weight: bold;
                                        color: #88c0d0;
                                    "
                                    id="tracks-count"
                                >
                                    0
                                </div>
                                <div
                                    style="
                                        font-size: 0.875rem;
                                        color: #d8dee9;
                                        opacity: 0.8;
                                    "
                                >
                                    Tracks
                                </div>
                            </div>
                            <div style="text-align: center">
                                <div
                                    style="
                                        font-size: 1.5rem;
                                        font-weight: bold;
                                        color: #88c0d0;
                                    "
                                    id="tracks-total-time"
                                >
                                    0h 0m
                                </div>
                                <div
                                    style="
                                        font-size: 0.875rem;
                                        color: #d8dee9;
                                        opacity: 0.8;
                                    "
                                >
                                    Total Listening Time
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="dashboard-content">
                    <div id="tracks-container" class="dashboard-tracks-grid">
                        <div class="loading">Loading your top tracks...</div>
                    </div>
                </div>
            </section>

            <!-- All Videos View -->
            <section id="all-videos-view" class="dashboard-view">
                <div class="view-section">
                    <h2 class="section-title">All Tracked Videos</h2>

                    <div class="dashboard-controls">
                        <div class="search-bar">
                            <input
                                type="text"
                                id="search-input"
                                placeholder="Search by title or channel..."
                            />
                        </div>

                        <div class="filter-group">
                            <button
                                class="filter-btn tab active"
                                data-filter="all"
                            >
                                All <span class="count" id="count-all">0</span>
                            </button>
                            <button class="filter-btn tab" data-filter="songs">
                                🎵 Songs
                                <span class="count" id="count-songs">0</span>
                            </button>
                            <button class="filter-btn tab" data-filter="videos">
                                📹 Videos
                                <span class="count" id="count-videos">0</span>
                            </button>
                        </div>

                        <div class="sort-group">
                            <label for="sort-by">Sort by:</label>
                            <select id="sort-by">
                                <option value="last-played">
                                    Recently Played
                                </option>
                                <option value="recent">Recently Added</option>
                                <option value="oldest">Oldest Added</option>
                                <option value="most-played">Most Played</option>
                                <option value="duration-desc">
                                    Longest Duration
                                </option>
                                <option value="duration-asc">
                                    Shortest Duration
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="dashboard-content">
                    <div id="videos-container" class="dashboard-videos-list">
                        <div class="loading">Loading videos...</div>
                    </div>
                </div>
            </section>

            <!-- Statistics View -->
            <section id="stats-view" class="dashboard-view">
                <div class="view-section">
                    <h2 class="section-title">Your Listening Statistics</h2>
                </div>

                <div class="dashboard-content">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">🎵</div>
                            <div class="stat-value" id="stat-total-songs">
                                -
                            </div>
                            <div class="stat-label">Total Songs</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-icon">⏱️</div>
                            <div class="stat-value" id="stat-listening-time">
                                -
                            </div>
                            <div class="stat-label">Listening Time</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-icon">▶️</div>
                            <div class="stat-value" id="stat-total-plays">
                                -
                            </div>
                            <div class="stat-label">Total Plays</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-icon">📹</div>
                            <div class="stat-value" id="stat-total-videos">
                                -
                            </div>
                            <div class="stat-label">Total Videos</div>
                        </div>
                    </div>

                    <div class="loading" id="stats-loading">
                        Loading statistics...
                    </div>
                </div>
            </section>
        </div>

        <!-- Classification Modal -->
        <div id="classification-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Classify Video</h2>
                    <p class="modal-video-title" id="modal-video-title"></p>
                </div>

                <div class="classification-options">
                    <label class="classification-option">
                        <input
                            type="radio"
                            name="classification"
                            value="true"
                        />
                        <div class="option-content">
                            <div class="option-label">
                                <span>🎵</span>
                                <span>Song</span>
                            </div>
                            <div class="option-description">
                                Music videos, audio tracks, and songs
                            </div>
                        </div>
                    </label>

                    <label class="classification-option">
                        <input
                            type="radio"
                            name="classification"
                            value="false"
                        />
                        <div class="option-content">
                            <div class="option-label">
                                <span>📹</span>
                                <span>Video</span>
                            </div>
                            <div class="option-description">
                                Non-music content, vlogs, tutorials, etc.
                            </div>
                        </div>
                    </label>
                </div>

                <!-- Artist Selection (only shown for songs) -->
                <div
                    id="artist-selection"
                    style="display: none; margin-bottom: 24px"
                >
                    <label
                        for="artist-select"
                        style="
                            display: block;
                            margin-bottom: 8px;
                            font-size: 14px;
                            font-weight: 600;
                            color: #88c0d0;
                        "
                    >
                        Select Artist
                    </label>
                    <select
                        id="artist-select"
                        style="
                            width: 100%;
                            padding: 12px 16px;
                            background: rgba(67, 76, 94, 0.4);
                            border: 2px solid rgba(216, 222, 233, 0.1);
                            color: #eceff4;
                            font-size: 14px;
                            cursor: pointer;
                            transition: all 0.2s;
                        "
                    >
                        <option value="">Choose an artist...</option>
                        <!-- Artists will be populated dynamically -->
                    </select>

                    <!-- Add new artist section (hidden by default) -->
                    <div
                        id="new-artist-section"
                        style="display: none; margin-top: 12px"
                    >
                        <div style="display: flex; gap: 8px">
                            <input
                                type="text"
                                id="new-artist-name"
                                placeholder="Enter artist name..."
                                style="
                                    flex: 1;
                                    padding: 10px 14px;
                                    background: rgba(67, 76, 94, 0.4);
                                    border: 2px solid rgba(216, 222, 233, 0.1);
                                    color: #eceff4;
                                    font-size: 14px;
                                    transition: all 0.2s;
                                "
                            />
                            <button
                                id="save-new-artist"
                                class="modal-btn"
                                style="
                                    background: #88c0d0;
                                    color: #2e3440;
                                    padding: 10px 20px;
                                    white-space: nowrap;
                                "
                            >
                                Add
                            </button>
                            <button
                                id="cancel-new-artist"
                                class="modal-btn modal-btn-cancel"
                                style="padding: 10px 20px"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button
                        class="modal-btn modal-btn-cancel"
                        id="modal-cancel"
                    >
                        Cancel
                    </button>
                    <button class="modal-btn modal-btn-save" id="modal-save">
                        Save Classification
                    </button>
                </div>
            </div>
        </div>

        <script src="scripts/dashboard.js"></script>
    </body>
</html>
